<!DOCTYPE html>
<html lang="bg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F7F5F0">
  <title>Работническа култура — Начало</title>
  <link rel="icon" type="image/svg+xml" href="insta.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <div class="site-shell header-inner">
      <a class="brand" href="#home" id="brand-link"><img class="brand-mark" src="insta.svg" alt="" width="44" height="44"><span id="brand-text">Работническа култура</span></a>
      <nav class="main-nav" id="main-nav" aria-label="Основна навигация">
        <a href="#home" data-nav="home">Начало</a>
        <a href="#shop" data-nav="shop">Книги</a>
        <a href="#blog" data-nav="blog">Блог</a>
        <a href="#cart" data-nav="cart">Кошница <span id="cart-count">0</span></a>
      </nav>
      <div class="language-switch" role="group" aria-label="Език">
        <button type="button" data-lang="bg" aria-pressed="true" aria-label="Български">БГ</button><span aria-hidden="true">/</span><button type="button" data-lang="en" aria-pressed="false" aria-label="English">EN</button>
      </div>
    </div>
  </header>
  <main id="main-content"></main>
  <div class="sr-only" id="cart-status" role="status" aria-live="polite"></div>
  <footer class="site-footer">
    <div class="site-shell footer-inner">
      <div class="footer-brand" id="footer-brand">Работническа<br>култура</div>
      <div class="footer-note" id="footer-note">Българско марксистко издателство</div>
      <div class="footer-contacts" id="footer-contacts"></div>
      <a class="footer-top" href="#home" id="footer-top">Към началото</a>
    </div>
  </footer>
  <script src="books.js"></script>
  <script src="articles.js"></script>
  <script>
    const contacts = { instagram: 'https://www.instagram.com/rabotkult/', email: 'contact@rabotkult.com', address: { bg: 'гр. Ботевград, ж.к. Север, бл. 5, вх. А', en: 'Botevgrad, Sever Residential District, Bl. 5, Entrance A' } };
    const content = {
      bg: {
        brand: 'Работническа култура', nav: ['Начало', 'Книги', 'Блог', 'Кошница'], navigation: 'Основна навигация', language: 'Език', bgLabel: 'Български', enLabel: 'English',
        heroIntro: 'Българското марксистко издателство',
        featuredTag: 'Избрано от каталога', featuredNumber: '01 / 03', featuredTitle: 'Книги', allBooks: 'Всички книги',
        statementTag: 'Нашата позиция', statement: 'Класова солидарност, социална справедливост и освобождение от капиталистическата експлоатация чрез марксистка теория и практика.',
        writingTag: 'От редакцията', writingNumber: '02 / 03', writingTitle: 'Между редовете', allWriting: 'Всички текстове',
        shopTag: 'Каталог / 2026', shopTitle: 'Книги', shopIntro: 'Открийте марксистка литература, революционна теория и критически анализи на капитализма, класовата борба и обществените промени.',
        blogTag: 'Бележки / Архив', blogTitle: 'Блог', blogIntro: 'Идеи, анализи и критически размисли за класовата борба, капитализма и пътя към социалното освобождение.',
        categories: { all: 'Всички', theory: 'Теория', history: 'История', culture: 'Култура' },
        count: n => `${n} ${n === 1 ? 'книга' : 'книги'}`, pages: n => `${n} стр.`, format: 'Мека корица',
        minRead: n => `${n} мин четене`, backBlog: 'Назад към блога', footerNote: 'Теория, критика и идеи за друг свят.', backTop: 'Към началото', pageTitle: { home: 'Начало', shop: 'Книги', blog: 'Блог', cart: 'Кошница', order: 'Поръчка', confirmation: 'Благодарим' }
      },
      en: {
        brand: 'Workers’ Culture', nav: ['Home', 'Books', 'Blog', 'Cart'], navigation: 'Main navigation', language: 'Language', bgLabel: 'Bulgarian', enLabel: 'English',
        heroIntro: 'The Bulgarian marxist publisher',
        featuredTag: 'From the catalogue', featuredNumber: '01 / 03', featuredTitle: 'Books', allBooks: 'Explore all books',
        statementTag: 'What we believe', statement: 'Class solidarity, social justice, and liberation from capitalist exploitation through Marxist theory and practice.',
        writingTag: 'From the editors', writingNumber: '02 / 03', writingTitle: 'Between the lines', allWriting: 'All writing',
        shopTag: 'Catalogue / 2026', shopTitle: 'Books', shopIntro: 'Discover Marxist literature, revolutionary theory, and critical perspectives on capitalism, class struggle, and social change.',
        blogTag: 'Notes / Archive', blogTitle: 'Blog', blogIntro: 'Ideas, analyses, and critical reflections on class struggle, capitalism, and the path to social emancipation.',
        categories: { all: 'All', theory: 'Theory', history: 'History', culture: 'Culture' },
        count: n => `${n} ${n === 1 ? 'book' : 'books'}`, pages: n => `${n} pages`, format: 'Paperback',
        minRead: n => `${n} min read`, backBlog: 'Back to blog', footerNote: 'Theory, critique, and ideas for another world.', backTop: 'Back to top', pageTitle: { home: 'Home', shop: 'Books', blog: 'Blog', cart: 'Cart', order: 'Order', confirmation: 'Thank you' }
      }
    };

    const commerce = {
      bg: {
        detailTag: 'От каталога', backBooks: 'Назад към книгите', add: 'Добави в кошницата', added: 'Добавено в кошницата', unavailable: 'Временно недостъпна',
        cartTag: 'Преглед на вашата поръчка', cartTitle: 'Кошница', cartIntro: 'Вашите избрани заглавия', emptyCart: 'Кошницата ви е празна.', emptyCartHint: 'Разгледайте каталога и намерете следващото си четиво.', browseBooks: 'Разгледай книгите',
        quantity: 'Количество', remove: 'Премахни', maxQuantity: 'Максимум 20 броя от заглавие.', subtotal: 'Стойност на книгите', continueShopping: 'Продължи с книгите', checkout: 'Към поръчката',
        orderTag: 'Последна стъпка', orderTitle: 'Поръчка.', orderIntro: 'Оставете данните си и ще се свържем с вас за потвърждение и доставка.', contact: 'Вашите данни', name: 'Име и фамилия', email: 'Имейл', phone: 'Телефон', address: 'Адрес за доставка', city: 'Град', postal: 'Пощенски код', note: 'Бележка (по избор)', summary: 'Вашата поръчка', placeOrder: 'Изпрати заявката', sending: 'Изпращане…', orderNotice: 'Това е заявка за поръчка. Доставката и начинът на плащане се уточняват след потвърждение по имейл. Не плащате сега.', orderError: 'Не успяхме да изпратим заявката. Опитайте отново.', serviceUnavailable: 'Поръчките временно не са достъпни. Опитайте отново по-късно.', changedPrices: 'Каталогът е обновен. Прегледайте сумата и изпратете заявката отново.',
        successTag: 'Получена заявка', successTitle: 'Благодарим.', successIntro: 'Заявката ви е получена. Ще се свържем с вас по имейл за потвърждение на наличност, доставка и плащане.', orderNumber: 'Номер на заявката', noOrderNumber: 'Проверете имейла, посочен при заявката.',
        delivery: 'Куриер за доставка', deliveryEcont: 'Еконт', deliverySpeedy: 'Спиди', isbn: 'ISBN', dimensions: 'Размер', downloadEpub: 'Изтегли EPUB', epubUnavailable: 'EPUB не е наличен', image: 'Изображение', previousImage: 'Предишно изображение', nextImage: 'Следващо изображение', contactLabel: 'Контакти', emailLabel: 'Имейл', addressLabel: 'Адрес'
      },
      en: {
        detailTag: 'From the catalogue', backBooks: 'Back to books', add: 'Add to cart', added: 'Added to cart', unavailable: 'Temporarily unavailable',
        cartTag: 'Review your order', cartTitle: 'Cart', cartIntro: 'Your selected titles', emptyCart: 'Your cart is empty.', emptyCartHint: 'Explore the catalogue and find your next read.', browseBooks: 'Explore books',
        quantity: 'Quantity', remove: 'Remove', maxQuantity: 'Maximum 20 copies per title.', subtotal: 'Books subtotal', continueShopping: 'Continue browsing', checkout: 'Continue to order',
        orderTag: 'The final step', orderTitle: 'Order.', orderIntro: 'Leave your details and we will contact you to confirm availability and delivery.', contact: 'Your details', name: 'Full name', email: 'Email', phone: 'Phone', address: 'Delivery address', city: 'City', postal: 'Postal code', note: 'Note (optional)', summary: 'Your order', placeOrder: 'Send order request', sending: 'Sending…', orderNotice: 'This is an order request. Delivery and payment are arranged after confirmation by email. You are not charged now.', orderError: 'We could not send your request. Please try again.', serviceUnavailable: 'Orders are temporarily unavailable. Please try again later.', changedPrices: 'The catalogue has changed. Review the total and submit again.',
        successTag: 'Request received', successTitle: 'Thank you.', successIntro: 'Your request has been received. We will email you to confirm availability, delivery, and payment.', orderNumber: 'Request number', noOrderNumber: 'Please check the email address you provided.',
        delivery: 'Delivery courier', deliveryEcont: 'Econt', deliverySpeedy: 'Speedy', isbn: 'ISBN', dimensions: 'Dimensions', downloadEpub: 'Download EPUB', epubUnavailable: 'EPUB unavailable', image: 'Image', previousImage: 'Previous image', nextImage: 'Next image', contactLabel: 'Contact', emailLabel: 'Email', addressLabel: 'Address'
      }
    };

    const main = document.getElementById('main-content');
    let language;
    let cart = [];
    let lastOrder = null;
    let activeCategory = 'all';
    let galleryIndex = 0;
    let submitting = false;
    try {
      language = localStorage.getItem('rk-language') === 'en' ? 'en' : 'bg';
      const savedCart = JSON.parse(localStorage.getItem('rk-cart') || '[]');
      if (Array.isArray(savedCart)) cart = savedCart.filter(item => books.some(book => book.id === item.id) && Number.isInteger(item.quantity) && item.quantity > 0 && item.quantity <= 20).slice(0, 6);
      lastOrder = JSON.parse(sessionStorage.getItem('rk-last-order') || 'null');
    } catch { language = 'bg'; }
    if (lastOrder && !/^[0-9a-f-]{36}$/i.test(lastOrder.id)) lastOrder = null;

    function formatPrice(cents) {
      return new Intl.NumberFormat(language === 'bg' ? 'bg-BG' : 'en-IE', { style: 'currency', currency: 'EUR' }).format(cents / 100);
    }

    function cartItems() {
      return cart.map(item => ({ ...item, book: books.find(book => book.id === item.id) })).filter(item => item.book);
    }

    function cartTotal() {
      return cartItems().reduce((sum, item) => sum + item.book.priceCents * item.quantity, 0);
    }

    function saveCart() {
      try { localStorage.setItem('rk-cart', JSON.stringify(cart)); } catch {}
      document.getElementById('cart-count').textContent = cart.reduce((sum, item) => sum + item.quantity, 0);
    }

    function route() {
      let hash;
      try { hash = decodeURIComponent(location.hash.slice(1)); } catch { return { view: 'home' }; }
      if (['shop', 'blog', 'home', 'cart'].includes(hash)) return { view: hash };
      if (hash === 'order') return { view: cart.length ? 'order' : 'cart' };
      if (hash === 'order/success') return { view: lastOrder ? 'confirmation' : 'cart' };
      if (hash.startsWith('book/')) {
        const book = books.find(item => item.id === hash.slice(5));
        if (book) return { view: 'book', book };
      }
      if (hash.startsWith('article/')) {
        const article = articles.find(item => item.slug === hash.slice(8));
        if (article) return { view: 'article', article };
      }
      return { view: 'home' };
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, character => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[character]);
    }

    function arrowIcon(direction) {
      const paths = {
        upRight: 'M5 19 19 5 M7 5h12v12',
        left: 'M19 12H5 m7-7-7 7 7 7',
        right: 'M5 12h14 m-7-7 7 7-7 7',
        up: 'M12 19V5 m-7 7 7-7 7 7',
        down: 'M12 5v14 m-7-7 7 7 7-7'
      };
      return `<svg class="arrow-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="square" stroke-linejoin="miter" aria-hidden="true" focusable="false"><path d="${paths[direction]}"></path></svg>`;
    }

    function bookCover(book, index) {
      const b = book[language];
      if (book.images?.length) return `<img class="cover-image" src="${escapeHtml(book.images[0])}" alt="${escapeHtml(b.title)} — ${escapeHtml(b.author)}" loading="lazy">`;
      return `<div class="book-cover cover-${index + 1}" role="img" aria-label="${escapeHtml(b.title)} — ${escapeHtml(b.author)}"><div class="cover-top"><span>${b.top}</span><span>${language === 'bg' ? 'РК' : 'WC'}<br>26</span></div><div class="cover-main">${b.cover.map(line => `<span>${line}</span>`).join('')}</div><div class="cover-bottom"><span>${b.bottom}</span><span>${language === 'bg' ? 'РК<br>ИЗД.' : 'WC<br>PRESS'}</span></div></div>`;
    }

    function bookCard(book, index) {
      const t = content[language];
      const u = commerce[language];
      const b = book[language];
      return `<article class="book-card"><a class="book-stage" href="#book/${book.id}" aria-label="${b.title}">${bookCover(book, index)}</a><div class="book-info"><span class="eyebrow">${t.categories[book.category]} / 2026</span><h3><a href="#book/${book.id}">${b.title}</a></h3><p class="book-author">${b.author}</p><div class="book-extra"><span>${t.pages(book.pages)} · ${t.format}</span><strong>${formatPrice(book.priceCents)}</strong></div><button class="book-add" type="button" data-add="${book.id}" ${book.available === false ? 'disabled' : ''}>${book.available === false ? u.unavailable : u.add}<span aria-hidden="true">${arrowIcon('upRight')}</span></button></div></article>`;
    }

    function storyRow(article) {
      const t = content[language];
      return `<a class="story-row" href="#article/${article.slug}"><span class="eyebrow">${article.date[language]}<br>${t.minRead(article.minutes)}</span><h3>${article[language].title}</h3><span class="row-arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a>`;
    }

    function homeView() {
      const t = content[language];
      return `<div class="site-shell"><section class="hero" aria-labelledby="page-heading"><div class="hero-copy"><h1 id="page-heading" tabindex="-1"><span>${language === 'bg' ? 'Работническа' : 'Workers’'}</span><span>${language === 'bg' ? 'култура' : 'Culture'}</span></h1><p>${t.heroIntro}</p></div><img class="hero-logo" src="insta.svg" alt="" width="300" height="300"></section><section class="home-books" aria-labelledby="featured-heading"><div class="section-kicker eyebrow"><span>${t.featuredTag}</span><span>${t.featuredNumber}</span></div><div class="section-intro"><h2 id="featured-heading">${t.featuredTitle}</h2><a href="#shop" class="text-link">${t.allBooks}<span class="arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a></div><div class="book-grid">${books.slice(0, 4).map(bookCard).join('')}</div></section></div><section class="statement" aria-labelledby="statement-heading"><div class="site-shell statement-inner"><span class="eyebrow">${t.statementTag}</span><h2 id="statement-heading">${t.statement}</h2></div></section><section class="site-shell writing-section" aria-labelledby="writing-heading"><div class="section-kicker eyebrow"><span>${t.writingTag}</span><span>${t.writingNumber}</span></div><div class="section-intro"><h2 id="writing-heading">${t.writingTitle}</h2><a href="#blog" class="text-link">${t.allWriting}<span class="arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a></div><div class="story-list">${articles.slice(0, 2).map(storyRow).join('')}</div></section>`;
    }

    function shopView() {
      const t = content[language];
      const categories = ['all', 'theory', 'history', 'culture'];
      const visible = books.map((book, index) => ({ book, index })).filter(item => activeCategory === 'all' || item.book.category === activeCategory);
      return `<div class="site-shell"><section class="page-intro" aria-labelledby="page-heading"><span class="eyebrow">${t.shopTag}</span><h1 id="page-heading" tabindex="-1">${t.shopTitle}</h1><p>${t.shopIntro}</p></section><section class="catalog" aria-label="${t.shopTitle}"><div class="catalog-toolbar"><div class="filters" role="group" aria-label="${language === 'bg' ? 'Филтър по категория' : 'Filter by category'}">${categories.map(category => `<button class="filter-button" type="button" data-category="${category}" aria-pressed="${activeCategory === category}">${t.categories[category]}</button>`).join('')}</div><span class="catalog-count eyebrow" role="status">${t.count(visible.length)}</span></div><div class="book-grid">${visible.map(item => bookCard(item.book, item.index)).join('')}</div></section></div>`;
    }

    function blogView() {
      const t = content[language];
      return `<div class="site-shell"><section class="page-intro" aria-labelledby="page-heading"><span class="eyebrow">${t.blogTag}</span><h1 id="page-heading" tabindex="-1">${t.blogTitle}</h1><p>${t.blogIntro}</p></section><section class="blog-index" aria-label="${t.blogTitle}">${articles.map(article => `<a class="blog-entry" href="#article/${article.slug}"><span class="eyebrow">${article.date[language]}<br>${t.minRead(article.minutes)}</span><div><h2>${article[language].title}</h2><p>${article[language].excerpt}</p></div><span class="row-arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a>`).join('')}</section></div>`;
    }

    function articleView(article) {
      const t = content[language];
      const a = article[language];
      const translated = a.paragraphs.length > 0;
      const paragraphs = translated ? a.paragraphs : article.bg.paragraphs;
      return `<article class="site-shell article"><a class="text-link article-back" href="#blog"><span class="arrow" aria-hidden="true">${arrowIcon('left')}</span>${t.backBlog}</a><header class="article-header"><span class="eyebrow">${article.date[language]} / ${t.minRead(article.minutes)}</span><h1 id="page-heading" tabindex="-1">${a.title}</h1><p class="article-lede">${a.excerpt}</p></header><div class="article-body">${translated ? '' : '<p lang="en">This article is currently available in Bulgarian only.</p>'}${paragraphs.map(paragraph => /^<h3>.*<\/h3>$/.test(paragraph) ? paragraph : `<p${translated ? '' : ' lang="bg"'}>${paragraph}</p>`).join('')}<div class="article-end" aria-hidden="true"></div></div></article>`;
    }

    function gallery(book) {
      const u = commerce[language];
      const images = book.images || [];
      const active = Math.min(galleryIndex, Math.max(0, images.length - 1));
      const image = images.length ? `<img class="detail-image" src="${escapeHtml(images[active])}" alt="${escapeHtml(book[language].title)} — ${u.image} ${active + 1}" loading="eager">` : bookCover(book, books.indexOf(book));
      return `<div class="book-gallery"><div class="book-stage detail-stage" id="gallery-image">${image}</div>${images.length > 1 ? `<div class="gallery-controls"><button type="button" data-gallery="previous" aria-label="${u.previousImage}">${arrowIcon('left')}</button><span class="eyebrow" role="status">${active + 1} / ${images.length}</span><button type="button" data-gallery="next" aria-label="${u.nextImage}">${arrowIcon('right')}</button></div><div class="gallery-thumbs">${images.map((src, index) => `<button type="button" data-gallery-index="${index}" aria-label="${u.image} ${index + 1}" aria-pressed="${index === active}"><img src="${escapeHtml(src)}" alt="" loading="lazy"></button>`).join('')}</div>` : ''}</div>`;
    }

    function bookView(book) {
      const t = content[language];
      const u = commerce[language];
      const b = book[language];
      return `<div class="site-shell detail-page"><a class="text-link article-back" href="#shop"><span class="arrow" aria-hidden="true">${arrowIcon('left')}</span>${u.backBooks}</a><article class="detail-layout">${gallery(book)}<div class="detail-copy"><span class="eyebrow accent">${u.detailTag} / ${t.categories[book.category]}</span><h1 id="page-heading" tabindex="-1">${b.title}</h1><p class="detail-author">${b.author}</p><div class="detail-description">${(Array.isArray(b.description) ? b.description : [b.description]).filter(Boolean).map(paragraph => `<p>${paragraph}</p>`).join('')}</div><div class="detail-specs"><div><span>${u.isbn}</span><strong>${book.isbn ? escapeHtml(book.isbn) : '—'}</strong></div><div><span>${u.dimensions}</span><strong>${book.dimensionsMm ? `${escapeHtml(book.dimensionsMm)} mm` : '—'}</strong></div></div><div class="detail-meta"><span>${t.pages(book.pages)} · ${t.format}</span><strong>${formatPrice(book.priceCents)}</strong></div><div class="detail-actions"><button class="primary-button" type="button" data-add="${book.id}" ${book.available === false ? 'disabled' : ''}>${book.available === false ? u.unavailable : u.add}<span aria-hidden="true">${arrowIcon('upRight')}</span></button>${book.epub ? `<a class="epub-link" href="${escapeHtml(book.epub)}" download>${u.downloadEpub} <span aria-hidden="true">${arrowIcon('down')}</span></a>` : `<button class="epub-link" type="button" disabled>${u.downloadEpub} · ${u.epubUnavailable}</button>`}</div></div></article></div>`;
    }

    function cartView() {
      const u = commerce[language];
      const items = cartItems();
      const hasUnavailable = items.some(item => item.book.available === false);
      return `<div class="site-shell"><section class="page-intro" aria-labelledby="page-heading"><span class="eyebrow">${u.cartTag}</span><h1 id="page-heading" tabindex="-1">${u.cartTitle}</h1><p>${u.cartIntro}</p></section>${items.length ? `<div class="cart-layout"><div class="cart-list">${items.map(({ book, quantity }) => `<article class="cart-row"><div class="cart-number eyebrow">${String(books.indexOf(book) + 1).padStart(2, '0')}</div><div class="cart-book"><span class="eyebrow accent">${content[language].categories[book.category]}</span><h2><a href="#book/${book.id}">${book[language].title}</a></h2><p>${book[language].author}</p>${book.available === false ? `<p class="accent">${u.unavailable}</p>` : ''}</div><div class="cart-actions"><label>${u.quantity}<select data-quantity="${book.id}">${Array.from({ length: 20 }, (_, index) => `<option value="${index + 1}" ${quantity === index + 1 ? 'selected' : ''}>${index + 1}</option>`).join('')}</select></label><button type="button" data-remove="${book.id}">${u.remove}</button></div><strong class="cart-price">${formatPrice(book.priceCents * quantity)}</strong></article>`).join('')}</div><aside class="order-aside"><span class="eyebrow">${u.summary}</span><div class="total-line"><span>${u.subtotal}</span><strong>${formatPrice(cartTotal())}</strong></div><p>${u.orderNotice}</p>${hasUnavailable ? `<p class="accent" role="alert">${u.unavailable}</p>` : `<a class="primary-button" href="#order">${u.checkout}<span aria-hidden="true">${arrowIcon('upRight')}</span></a>`}<a class="text-link" href="#shop">${u.continueShopping}<span class="arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a></aside></div>` : `<section class="empty-cart"><h2>${u.emptyCart}</h2><p>${u.emptyCartHint}</p><a class="primary-button" href="#shop">${u.browseBooks}<span aria-hidden="true">${arrowIcon('upRight')}</span></a></section>`}</div>`;
    }

    function orderSummary() {
      const u = commerce[language];
      return `<span class="eyebrow">${u.summary}</span><ul class="summary-list">${cartItems().map(({ book, quantity }) => `<li><span>${book[language].title} × ${quantity}</span><strong>${formatPrice(book.priceCents * quantity)}</strong></li>`).join('')}</ul><div class="total-line"><span>${u.subtotal}</span><strong>${formatPrice(cartTotal())}</strong></div><p>${u.orderNotice}</p>`;
    }

    function orderView() {
      const u = commerce[language];
      if (!cart.length) return cartView();
      return `<div class="site-shell"><section class="page-intro" aria-labelledby="page-heading"><span class="eyebrow">${u.orderTag}</span><h1 id="page-heading" tabindex="-1">${u.orderTitle}</h1><p>${u.orderIntro}</p></section><div class="checkout-layout"><form id="order-form" class="order-form"><h2>${u.contact}</h2><div class="form-grid"><label class="full-field">${u.name}<input name="name" autocomplete="name" required minlength="2" maxlength="100"></label><label>${u.email}<input name="email" type="email" autocomplete="email" required maxlength="254"></label><label>${u.phone}<input name="phone" type="tel" autocomplete="tel" maxlength="30"></label></div>
        <fieldset class="delivery-choices"><legend>${u.delivery}</legend><div class="courier-options"><label><input type="radio" name="courier" value="econt" required><span><img src="assets/econt-logo.jpg" alt="${u.deliveryEcont}" width="170" height="38"></span></label><label><input type="radio" name="courier" value="speedy" required><span><img src="assets/speedy-logo.svg" alt="${u.deliverySpeedy}" width="170" height="51"></span></label></div></fieldset>
        <div class="form-grid"><label class="full-field">${u.address}<input name="address" autocomplete="street-address" required minlength="5" maxlength="200"></label><label>${u.city}<input name="city" autocomplete="address-level2" required minlength="2" maxlength="100"></label><label>${u.postal}<input name="postalCode" autocomplete="postal-code" required minlength="3" maxlength="20"></label></div>
        <div class="form-grid"><label class="full-field note-field">${u.note}<textarea name="note" rows="4" maxlength="500"></textarea></label></div><p id="order-error" class="form-error" role="alert" tabindex="-1" hidden></p><button class="primary-button" type="submit" ${submitting ? 'disabled' : ''}>${submitting ? u.sending : u.placeOrder}<span aria-hidden="true">${arrowIcon('upRight')}</span></button></form><aside class="order-aside" id="order-summary">${orderSummary()}</aside></div></div>`;
    }

    function confirmationView() {
      const u = commerce[language];
      return `<div class="site-shell confirmation"><span class="eyebrow accent">${u.successTag}</span><h1 id="page-heading" tabindex="-1">${u.successTitle}</h1><p>${u.successIntro}</p>${lastOrder && lastOrder.id ? `<div class="confirmation-number"><span class="eyebrow">${u.orderNumber}</span><strong>${lastOrder.id}</strong></div>` : `<p>${u.noOrderNumber}</p>`}<a href="#shop" class="text-link">${u.browseBooks}<span class="arrow" aria-hidden="true">${arrowIcon('upRight')}</span></a></div>`;
    }

    function render(focusHeading = false) {
      const t = content[language];
      const current = route();
      document.documentElement.lang = language;
      document.getElementById('brand-text').textContent = t.brand;
      document.getElementById('main-nav').setAttribute('aria-label', t.navigation);
      document.querySelector('.language-switch').setAttribute('aria-label', t.language);
      document.querySelector('[data-lang="bg"]').setAttribute('aria-label', t.bgLabel);
      document.querySelector('[data-lang="en"]').setAttribute('aria-label', t.enLabel);
      document.querySelectorAll('[data-lang]').forEach(button => button.setAttribute('aria-pressed', String(button.dataset.lang === language)));
      document.querySelectorAll('[data-nav]').forEach((link, index) => {
        if (link.dataset.nav === 'cart') link.firstChild.textContent = `${t.nav[index]} `;
        else link.textContent = t.nav[index];
        const activeView = current.view === 'article' ? 'blog' : current.view === 'book' ? 'shop' : ['order', 'confirmation'].includes(current.view) ? 'cart' : current.view;
        if (link.dataset.nav === activeView) link.setAttribute('aria-current', 'page');
        else link.removeAttribute('aria-current');
      });
      saveCart();
      document.getElementById('footer-brand').innerHTML = language === 'bg' ? 'Работническа<br>култура.' : 'Workers’<br>Culture.';
      document.getElementById('footer-note').textContent = t.footerNote;
      const u = commerce[language];
      const instagramIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="18" cy="6" r="1" fill="currentColor" stroke="none"/></svg>';
      const emailIcon = '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><rect x="2" y="4" width="20" height="16"/><path d="m2 5 10 8 10-8"/></svg>';
      const instagram = /^https:\/\/((www\.)?instagram\.com)\//i.test(contacts.instagram) ? `<a href="${escapeHtml(contacts.instagram)}" target="_blank" rel="noopener noreferrer">${instagramIcon} Instagram ${arrowIcon('upRight')}</a>` : `<span>${instagramIcon} Instagram —</span>`;
      const email = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(contacts.email) ? `<a href="mailto:${encodeURIComponent(contacts.email)}">${emailIcon} ${escapeHtml(contacts.email)}</a>` : `<span>${emailIcon} ${u.emailLabel} —</span>`;
      document.getElementById('footer-contacts').innerHTML = `<span class="eyebrow">${u.contactLabel}</span>${instagram}${email}<span class="footer-address"><strong>${u.addressLabel}</strong> ${contacts.address[language] ? escapeHtml(contacts.address[language]) : '—'}</span>`;
      document.getElementById('footer-top').innerHTML = `${escapeHtml(t.backTop)} ${arrowIcon('up')}`;
      const views = { home: homeView, shop: shopView, blog: blogView, cart: cartView, order: orderView, confirmation: confirmationView };
      main.innerHTML = current.view === 'article' ? articleView(current.article) : current.view === 'book' ? bookView(current.book) : views[current.view]();
      const title = current.view === 'article' ? current.article[language].title : current.view === 'book' ? current.book[language].title : t.pageTitle[current.view];
      document.title = `${title} — ${t.brand}`;
      if (focusHeading) {
        window.scrollTo(0, 0);
        document.getElementById('page-heading').focus({ preventScroll: true });
      }
    }

    function updateCatalog(rows) {
      if (!Array.isArray(rows)) return;
      const catalog = new Map(rows.map(row => [row.id, row]));
      books.forEach(book => {
        const row = catalog.get(book.id);
        book.available = Boolean(row && row.active);
        if (row && Number.isSafeInteger(row.priceCents) && row.priceCents > 0) book.priceCents = row.priceCents;
      });
      if (main.querySelector('#order-form')) {
        main.querySelector('#order-summary').innerHTML = orderSummary();
        if (cartItems().some(item => item.book.available === false)) showOrderError(commerce[language].unavailable);
      } else render();
    }

    async function loadCatalog() {
      if (location.protocol === 'file:') return;
      try {
        const response = await fetch('/api/catalog', { cache: 'no-store' });
        if (response.ok) {
          const result = await response.json();
          updateCatalog(result.books);
        }
      } catch {}
    }

    function showOrderError(message) {
      const error = document.getElementById('order-error');
      if (!error) return;
      error.textContent = message;
      error.hidden = false;
      error.focus();
    }

    function cartChanged() {
      try { sessionStorage.removeItem('rk-checkout-key'); } catch {}
      saveCart();
      if (['cart', 'order'].includes(route().view)) render();
    }

    document.querySelectorAll('[data-lang]').forEach(button => button.addEventListener('click', () => {
      if (language === button.dataset.lang) return;
      const form = main.querySelector('#order-form');
      const values = form ? Object.fromEntries(new FormData(form)) : null;
      language = button.dataset.lang;
      try { localStorage.setItem('rk-language', language); } catch {}
      render();
      if (values) Object.entries(values).forEach(([name, value]) => {
        const input = main.querySelector(`[name="${name}"]`);
        if (input?.type === 'radio') main.querySelector(`[name="${name}"][value="${value}"]`).checked = true;
        else if (input) input.value = value;
      });
      document.querySelector(`[data-lang="${language}"]`).focus();
    }));

    main.addEventListener('click', event => {
      const galleryButton = event.target.closest('[data-gallery], [data-gallery-index]');
      if (galleryButton) {
        const currentBook = route().book;
        if (!currentBook?.images?.length) return;
        if (galleryButton.hasAttribute('data-gallery-index')) galleryIndex = Number(galleryButton.dataset.galleryIndex);
        else galleryIndex = (galleryIndex + (galleryButton.dataset.gallery === 'next' ? 1 : -1) + currentBook.images.length) % currentBook.images.length;
        main.querySelector('.book-gallery').outerHTML = gallery(currentBook);
        main.querySelector(galleryButton.hasAttribute('data-gallery-index') ? `[data-gallery-index="${galleryIndex}"]` : `[data-gallery="${galleryButton.dataset.gallery}"]`)?.focus();
        return;
      }
      const filter = event.target.closest('[data-category]');
      if (filter) {
        activeCategory = filter.dataset.category;
        render();
        main.querySelector(`[data-category="${activeCategory}"]`).focus();
        return;
      }
      const add = event.target.closest('[data-add]');
      if (add) {
        const book = books.find(item => item.id === add.dataset.add);
        if (!book || book.available === false) return;
        const existing = cart.find(item => item.id === book.id);
        if (existing && existing.quantity >= 20) {
          document.getElementById('cart-status').textContent = commerce[language].maxQuantity;
          return;
        }
        if (existing) existing.quantity += 1;
        else cart.push({ id: book.id, quantity: 1 });
        cartChanged();
        document.getElementById('cart-status').textContent = `${book[language].title} — ${commerce[language].added}`;
        add.firstChild.textContent = `${commerce[language].added} `;
        window.setTimeout(() => { if (add.isConnected) add.firstChild.textContent = `${commerce[language].add} `; }, 1700);
        return;
      }
      const remove = event.target.closest('[data-remove]');
      if (remove) {
        cart = cart.filter(item => item.id !== remove.dataset.remove);
        cartChanged();
      }
    });

    main.addEventListener('change', event => {
      if (event.target.name === 'courier') {
        try { sessionStorage.removeItem('rk-checkout-key'); } catch {}
        return;
      }
      const select = event.target.closest('[data-quantity]');
      if (!select) return;
      const item = cart.find(entry => entry.id === select.dataset.quantity);
      if (!item) return;
      item.quantity = Number(select.value);
      cartChanged();
      main.querySelector(`[data-quantity="${item.id}"]`)?.focus();
    });

    main.addEventListener('input', event => {
      if (event.target.closest('#order-form')) {
        try { sessionStorage.removeItem('rk-checkout-key'); } catch {}
      }
    });

    main.addEventListener('submit', async event => {
      if (event.target.id !== 'order-form') return;
      event.preventDefault();
      if (submitting || !cart.length) return;
      if (cartItems().some(item => item.book.available === false)) {
        showOrderError(commerce[language].unavailable);
        return;
      }
      const form = event.target;
      const customer = Object.fromEntries(new FormData(form));
      const button = form.querySelector('[type="submit"]');
      const error = form.querySelector('#order-error');
      error.hidden = true;
      submitting = true;
      button.disabled = true;
      button.firstChild.textContent = `${commerce[language].sending} `;
      try {
        let key;
        try {
          key = sessionStorage.getItem('rk-checkout-key') || crypto.randomUUID();
          sessionStorage.setItem('rk-checkout-key', key);
        } catch { key = crypto.randomUUID(); }
        const response = await fetch('/api/orders', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ customer, language, items: cart.map(item => ({ id: item.id, quantity: item.quantity })), expectedTotalCents: cartTotal(), idempotencyKey: key })
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) {
          if (response.status === 409 && ['PRICE_CHANGED', 'UNAVAILABLE'].includes(result.error)) {
            updateCatalog(result.catalog);
            showOrderError(result.error === 'PRICE_CHANGED' ? commerce[language].changedPrices : commerce[language].unavailable);
          } else showOrderError(response.status >= 500 ? commerce[language].serviceUnavailable : commerce[language].orderError);
          return;
        }
        if (!/^[0-9a-f-]{36}$/i.test(result.id)) throw new Error('Invalid order response');
        lastOrder = { id: result.id };
        try {
          sessionStorage.setItem('rk-last-order', JSON.stringify(lastOrder));
          sessionStorage.removeItem('rk-checkout-key');
        } catch {}
        cart = [];
        saveCart();
        location.hash = '#order/success';
      } catch {
        showOrderError(commerce[language].serviceUnavailable);
      } finally {
        submitting = false;
        if (button.isConnected) {
          button.disabled = false;
          button.firstChild.textContent = `${commerce[language].placeOrder} `;
        }
      }
    });

    window.addEventListener('hashchange', () => { galleryIndex = 0; render(true); });
    render();
    loadCatalog();
  </script>
</body>
</html>
